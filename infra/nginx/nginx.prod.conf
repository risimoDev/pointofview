worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  client_max_body_size 5g;   # test-video uploads (admin) can be large

  # Docker's embedded DNS. Re-resolving upstream hostnames on a short TTL
  # (instead of a static "upstream {}" block resolved once at startup)
  # keeps nginx working after api/web containers are recreated with a new
  # IP by ./scripts/update.sh — otherwise nginx keeps the stale IP and
  # returns 502 until it's restarted.
  resolver 127.0.0.11 valid=10s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # Baseline browser hardening. Deliberately NOT a full Content-Security-
    # Policy: Next.js needs inline styles and nonced scripts, and a CSP written
    # blind here would break the app on deploy. These four are safe for this
    # app and close the cheap attacks — clickjacking, MIME sniffing, base-tag
    # injection, referrer leakage of internal URLs.
    # HSTS belongs on the VPS, where TLS actually terminates.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    include /etc/nginx/locations.inc;
  }
}
